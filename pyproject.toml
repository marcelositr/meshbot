[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meshbot"
version = "0.1.0"
description = "A modular bot for Meshtastic networks."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Marcelo Trindade" }]
dependencies = [
    "requests>=2.32",
    "meshtastic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["mypy>=1.17", "pytest>=8.4", "ruff>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["meshbot"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["meshtastic.*"]
ignore_missing_imports = true
