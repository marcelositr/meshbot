# ============================================================
# MESHBOT - CONFIGURAÇÃO
# ============================================================
#
# Copie este arquivo para config/config.toml.
# O arquivo config.toml é ignorado pelo Git.
#
# Se você não sabe o que uma opção faz, prefira manter o valor
# padrão. As explicações abaixo são para facilitar a configuração
# por pessoas que não trabalham com programação.
#
# ============================================================


# ------------------------------------------------------------
# 1. FUNCIONALIDADES
# ------------------------------------------------------------
# Aqui você escolhe quais recursos opcionais do MeshBot serão
# usados nesta instalação.
#
# true  = recurso ligado
# false = recurso desligado
#
# Os recursos de cadastro, nomes, administração, bloqueio,
# desbloqueio e silenciamento são básicos do MeshBot e não
# aparecem aqui porque continuam sempre disponíveis.
[features]

# Responde !ping com "pong".
ping = true

# Permite consultar a previsão sob demanda:
# !tempo <cidade>
weather_command = true

# Permite o envio automático dos boletins de tempo configurados
# na seção [weather].
weather_bulletin = true

# Permite consultar alertas da Defesa Civil:
# !defesacivil <cidade>
defense_civil_command = true

# Permite o monitoramento automático dos alertas da Defesa Civil.
# Os detalhes ficam na seção [defesa_civil].
defense_civil_monitor = true


# ------------------------------------------------------------
# 2. AMBIENTE
# ------------------------------------------------------------
# development = testes no simulador
# production  = uso normal
environment = "development"


# ------------------------------------------------------------
# 3. IDENTIDADE DO BOT
# ------------------------------------------------------------
# Nome mostrado pelo programa ao iniciar.
name = "MeshBot"

# Símbolo usado antes dos comandos.
# Exemplo: !ping, !tempo Ribeirão Preto/SP
command_prefix = "!"


# ------------------------------------------------------------
# 4. CONEXÃO COM A REDE
# ------------------------------------------------------------
# simulator = simulador local, recomendado para testes
# wifi      = Meshtastic via Wi-Fi
# bluetooth = Meshtastic via Bluetooth
# usb       = Meshtastic via USB
transport = "simulator"

# Nome do canal Meshtastic.
channel_name = "LongFast"

# Número do canal usado pelo bot.
channel_index = 0

# Só é necessário para algumas formas de conexão.
# Exemplos:
# device = "/dev/ttyUSB0"          # USB
# device = "192.168.1.50"         # Wi-Fi
# device = "AA:BB:CC:DD:EE:FF"   # Bluetooth


# ------------------------------------------------------------
# 5. ADMINISTRADORES
# ------------------------------------------------------------
# Coloque aqui os node IDs dos administradores.
# Exemplo:
# admins = ["!12345678", "!87654321"]
#
# Administradores não podem moderar outros administradores.
admins = []


# ------------------------------------------------------------
# 6. BANCO DE DADOS
# ------------------------------------------------------------
# Arquivo usado para guardar cadastro e moderação.
database_path = "data/meshbot.db"


# ------------------------------------------------------------
# 7. MODERAÇÃO
# ------------------------------------------------------------
# Tempo padrão de silenciamento, em minutos.
default_silence_minutes = 30


# ------------------------------------------------------------
# 8. LOG
# ------------------------------------------------------------
# DEBUG = mais detalhes para diagnóstico
# INFO  = recomendado
# WARNING = somente avisos
# ERROR = somente erros
log_level = "INFO"


# ------------------------------------------------------------
# 9. ENVIO DE MENSAGENS
# ------------------------------------------------------------
# Intervalo, em segundos, entre mensagens consecutivas.
# Isso ajuda a evitar que uma resposta longa seja transmitida
# toda de uma vez.
[messaging]
message_delay_seconds = 5


# ------------------------------------------------------------
# 10. TEMPO
# ------------------------------------------------------------
[weather]

# Serviço usado para consultar a previsão.
provider = "inmet"

# Tempo máximo de espera, em segundos.
timeout_seconds = 30

# Horários usados pelo bot para separar manhã, tarde e noite.
[weather.periods]
morning_start = "06:00"
afternoon_start = "12:00"
night_start = "18:00"

# Envio automático de boletim: desligado por padrão.
# Para usar, também deixe weather_bulletin = true em [features].
automatic_enabled = false

# Cidade usada no boletim automático.
# Exemplo:
# location = "Ribeirão Preto/SP"

# Destino do boletim automático.
# ^all = todos os nós da rede.
# Exemplo:
# recipient_id = "^all"


# ------------------------------------------------------------
# 11. DEFESA CIVIL
# ------------------------------------------------------------
[defesa_civil]

# Ativa a consulta de Defesa Civil.
# Se false, !defesacivil não fará consultas.
enabled = true

# Como os alertas serão apresentados:
#
# normal    = resposta mais curta
# attention = acrescenta urgência e instruções
# emergency = acrescenta descrição, urgência, certeza e instruções
mode = "normal"

# Número máximo de alertas mostrados em uma consulta.
max_alerts = 5

# Tamanho máximo de cada mensagem enviada pelo rádio.
max_message_length = 180

# Monitoramento automático de alertas: desligado por padrão.
# Para usar, também deixe defense_civil_monitor = true em [features].
automatic_enabled = false

# Cidade/região monitorada automaticamente.
# Exemplo:
# location = "Ribeirão Preto/SP"

# Destino dos alertas automáticos.
# ^all = todos os nós da rede.
# Exemplo:
# recipient_id = "^all"

# Intervalo entre consultas ao serviço, em segundos.
# Exemplo:
# poll_interval_seconds = 300

# ------------------------------------------------------------
# AJUSTE FINO DA APRESENTAÇÃO DOS ALERTAS
# ------------------------------------------------------------
# Normalmente não é preciso alterar estas opções.
# Se forem omitidas, o modo escolhido acima define os padrões.
#
# show_severity = true
# show_description = false
# show_instruction = false
# show_urgency = false
# show_certainty = false
