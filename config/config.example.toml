# ============================================================
# MESHBOT - CONFIGURAÇÃO
# ============================================================
#
# Copie este arquivo para config/config.toml.
# O arquivo config.toml é ignorado pelo Git.
#
# A configuração padrão é segura: usa o simulador e não
# transmite em uma rede Meshtastic real.
#
# ============================================================

# ------------------------------------------------------------
# AMBIENTE
# ------------------------------------------------------------
environment = "development"

# ------------------------------------------------------------
# IDENTIDADE DO BOT
# ------------------------------------------------------------
name = "MeshBot"

# ------------------------------------------------------------
# TRANSPORTE
# ------------------------------------------------------------
# simulator = rede/chat local
# wifi      = Meshtastic via Wi-Fi
# bluetooth = Meshtastic via Bluetooth
# usb       = Meshtastic via USB
transport = "simulator"

# ------------------------------------------------------------
# MESHTASTIC
# ------------------------------------------------------------
channel_name = "LongFast"
channel_index = 0

# ------------------------------------------------------------
# ADMINISTRADORES
# ------------------------------------------------------------
# Exemplo:
# admins = ["!12345678", "!87654321"]
#
# Administradores não podem moderar outros administradores.
admins = []

# ------------------------------------------------------------
# CADASTRO DE USUÁRIOS
# ------------------------------------------------------------
registration_requires_admin = true

# ------------------------------------------------------------
# MODERAÇÃO
# ------------------------------------------------------------
default_silence_minutes = 30

# ------------------------------------------------------------
# COMANDOS
# ------------------------------------------------------------
command_prefix = "/"

# ------------------------------------------------------------
# ENVIO DE MENSAGENS
# ------------------------------------------------------------
# Intervalo entre mensagens consecutivas da mesma resposta.
[messaging]
message_delay_seconds = 5

# ------------------------------------------------------------
# TEMPO
# ------------------------------------------------------------
# Provedor usado para obter a previsão.
[weather]
provider = "inmet"

# Tempo máximo de espera por uma resposta do serviço.
timeout_seconds = 30

# O bot escolhe automaticamente manhã, tarde ou noite
# de acordo com o horário atual.
#
# Estes horários são configuráveis para cada rede.
[weather.periods]
morning_start = "06:00"
afternoon_start = "12:00"
night_start = "18:00"

# ------------------------------------------------------------
# LOG
# ------------------------------------------------------------
# DEBUG, INFO, WARNING ou ERROR
log_level = "INFO"
